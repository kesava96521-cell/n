<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous College Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-indigo-400"></i>
                <span class="font-bold text-xl tracking-wide">Autonomous College Portal</span>
            </div>
            <div id="nav-auth-section" class="flex items-center space-x-4">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- 1. LOGIN / LANDING VIEW -->
        <section id="view-login" class="max-w-md mx-auto bg-white rounded-xl shadow-lg border border-slate-100 p-8 fade-in mt-10">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">Portal Login</h2>
                <p class="text-sm text-slate-500 mt-1">Access your Student, Lecturer, or HOD dashboard</p>
            </div>
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Roll Number / Mobile / User ID</label>
                    <input type="text" id="login-identifier" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Enter Roll No, Mobile or ID">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">Login</button>
            </form>
            <div class="mt-6 text-center border-t pt-4">
                <p class="text-sm text-slate-600">New User? <button onclick="switchView('view-register-select')" class="text-indigo-600 font-semibold hover:underline">Create Now</button></p>
            </div>
        </section>

        <!-- 2. REGISTRATION: OCCUPATION SELECTION VIEW -->
        <section id="view-register-select" class="max-w-md mx-auto bg-white rounded-xl shadow-lg border border-slate-100 p-8 fade-in mt-10 hidden">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">Join Portal</h2>
                <p class="text-sm text-slate-500 mt-1">Please select your occupation</p>
            </div>
            <form onsubmit="handleOccupationSelect(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Select Occupation</label>
                    <select id="reg-occupation" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                        <option value="">-- Choose Role --</option>
                        <option value="student">Student</option>
                        <option value="lecture">Lecturer</option>
                        <option value="hod">HOD</option>
                    </select>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="switchView('view-login')" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg transition">Back</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Next</button>
                </div>
            </form>
        </section>

        <!-- 3. DYNAMIC REGISTRATION FORM VIEW -->
        <section id="view-register-form" class="max-w-lg mx-auto bg-white rounded-xl shadow-lg border border-slate-100 p-8 fade-in mt-6 hidden">
            <div class="text-center mb-6">
                <h2 id="reg-form-title" class="text-2xl font-bold text-indigo-900">Registration Form</h2>
                <p class="text-sm text-slate-500 mt-1">Fill in your official institutional credentials</p>
            </div>
            <form id="dynamic-reg-form" onsubmit="handleRegistrationSubmit(event)" class="space-y-4">
                <!-- Dynamic form fields injected here -->
            </form>
        </section>

        <!-- 4. DASHBOARD VIEW (Role-based container) -->
        <section id="view-dashboard" class="fade-in hidden">
            <!-- Header Tabs handled by JS -->
            <div id="dashboard-header" class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border mb-6 gap-4"></div>
            <!-- Dynamic Content Area -->
            <div id="dashboard-content"></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t py-4 text-center text-xs text-slate-500 mt-auto">
        Autonomous College Management & Academic Tracking System &copy; 2026
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Initialize Default Database Data if empty
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([]));
        }
        if (!localStorage.getItem('attendance_records')) {
            localStorage.setItem('attendance_records', JSON.stringify([])); // {studentRoll, subject, date, status}
        }
        if (!localStorage.getItem('marks_records')) {
            localStorage.setItem('marks_records', JSON.stringify([])); // {studentRoll, subject, examType, maxMarks, obtainedMarks, semester}
        }
        if (!localStorage.getItem('student_master')) {
            localStorage.setItem('student_master', JSON.stringify([
                { rollNumber: "CS101", fullName: "Rahul Sharma", group: "CSE", semester: "Sem 3" },
                { rollNumber: "CS102", fullName: "Priya Patel", group: "CSE", semester: "Sem 3" }
            ]));
        }

        let currentUser = JSON.parse(sessionStorage.getItem('activeUser')) || null;

        window.onload = function() {
            if (currentUser) {
                showDashboard(currentUser.role);
            } else {
                switchView('view-login');
            }
        };

        function switchView(viewId) {
            ['view-login', 'view-register-select', 'view-register-form', 'view-dashboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            updateNavAuth();
        }

        function updateNavAuth() {
            const navAuth = document.getElementById('nav-auth-section');
            if (currentUser) {
                navAuth.innerHTML = `
                    <span class="text-sm bg-indigo-800 px-3 py-1 rounded-full"><i class="fa-solid fa-user-circle mr-1"></i> ${currentUser.fullName || currentUser.name || currentUser.userId} (${currentUser.role.toUpperCase()})</span>
                    <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded text-sm transition"><i class="fa-solid fa-power-off mr-1"></i> Logout</button>
                `;
            } else {
                navAuth.innerHTML = `<span class="text-xs text-indigo-200">Secure Web Portal</span>`;
            }
        }

        function logout() {
            sessionStorage.removeItem('activeUser');
            currentUser = null;
            switchView('view-login');
        }

        // Handle Login
        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            const users = JSON.parse(localStorage.getItem('users'));
            const user = users.find(u => 
                (u.rollNumber === identifier || u.mobile === identifier || u.userId === identifier || u.email === identifier) && 
                u.password === password
            );

            if (user) {
                currentUser = user;
                sessionStorage.setItem('activeUser', JSON.stringify(user));
                showDashboard(user.role);
            } else {
                alert("Invalid Credentials or User Not Found!");
            }
        }

        // Handle Occupation Choice for Registration
        function handleOccupationSelect(e) {
            e.preventDefault();
            const occupation = document.getElementById('reg-occupation').value;
            if (!occupation) return;

            const formContainer = document.getElementById('dynamic-reg-form');
            document.getElementById('reg-form-title').innerText = `Register as ${occupation.toUpperCase()}`;
            
            let htmlContent = `<input type="hidden" id="reg-role" value="${occupation}">`;

            if (occupation === 'student') {
                htmlContent += `
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">College Name</label><input type="text" id="r-clg" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label><input type="text" id="r-name" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Roll Number</label><input type="text" id="r-roll" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Group (e.g., CSE, ECE)</label><input type="text" id="r-group" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Year</label><input type="text" id="r-year" placeholder="e.g. 2nd Year" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Semester</label><input type="text" id="r-sem" placeholder="e.g. Sem 3" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    </div>
                `;
            } else if (occupation === 'lecture') {
                htmlContent += `
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">College Name</label><input type="text" id="r-clg" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Lecturer Full Name</label><input type="text" id="r-name" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Mobile Number</label><input type="text" id="r-mobile" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Experience (Years)</label><input type="number" id="r-exp" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                `;
            } else if (occupation === 'hod') {
                htmlContent += `
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">College Name</label><input type="text" id="r-clg" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label><input type="text" id="r-name" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Mobile Number</label><input type="text" id="r-mobile" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">HOD For Department</label><input type="text" id="r-dept" placeholder="e.g. Computer Science" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                `;
            }

            htmlContent += `
                <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Create Password</label><input type="password" id="r-pass" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Confirm Password</label><input type="password" id="r-cpass" required class="w-full px-4 py-2 border rounded-lg text-sm"></div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="switchView('view-register-select')" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg transition">Back</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Register & Save</button>
                </div>
            `;

            formContainer.innerHTML = htmlContent;
            switchView('view-register-form');
        }

        // Handle Form Database Save on Registration
        function handleRegistrationSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('reg-role').value;
            const password = document.getElementById('r-pass').value;
            const cpass = document.getElementById('r-cpass').value;

            if (password !== cpass) {
                alert("Passwords do not match!");
                return;
            }

            let userData = { role, password };
            let uniqueId = 'ID-' + Math.floor(100000 + Math.random() * 900000);

            if (role === 'student') {
                userData.college = document.getElementById('r-clg').value;
                userData.fullName = document.getElementById('r-name').value;
                userData.rollNumber = document.getElementById('r-roll').value;
                userData.group = document.getElementById('r-group').value;
                userData.year = document.getElementById('r-year').value;
                userData.semester = document.getElementById('r-sem').value;
                userData.userId = userData.rollNumber;
            } else if (role === 'lecture') {
                userData.college = document.getElementById('r-clg').value;
                userData.fullName = document.getElementById('r-name').value;
                userData.mobile = document.getElementById('r-mobile').value;
                userData.experience = document.getElementById('r-exp').value;
                userData.userId = uniqueId;
            } else if (role === 'hod') {
                userData.college = document.getElementById('r-clg').value;
                userData.fullName = document.getElementById('r-name').value;
                userData.mobile = document.getElementById('r-mobile').value;
                userData.department = document.getElementById('r-dept').value;
                userData.userId = uniqueId;
            }

            let users = JSON.parse(localStorage.getItem('users'));
            if(users.some(u => u.rollNumber === userData.rollNumber || u.mobile === userData.mobile)) {
                alert("User already registered with this Roll Number/Mobile!");
                return;
            }

            users.push(userData);
            localStorage.setItem('users', JSON.stringify(users));

            // Also push student to master list if student role
            if (role === 'student') {
                let sm = JSON.parse(localStorage.getItem('student_master'));
                if(!sm.some(s => s.rollNumber === userData.rollNumber)) {
                    sm.push({ rollNumber: userData.rollNumber, fullName: userData.fullName, group: userData.group, semester: userData.semester });
                    localStorage.setItem('student_master', JSON.stringify(sm));
                }
            }

            alert(`Registration Successful! Your System ID / Login ID is: ${userData.userId}`);
            switchView('view-login');
        }

        // Route to respective Dashboards
        function showDashboard(role) {
            switchView('view-dashboard');
            if (role === 'student') renderStudentHome();
            else if (role === 'lecture') renderLectureHome();
            else if (role === 'hod') renderHODHome();
        }

        /* ==================== STUDENT DASHBOARD ==================== */
        function renderStudentHome() {
            const header = document.getElementById('dashboard-header');
            header.innerHTML = `
                <div>
                    <h2 class="text-xl font-bold text-indigo-900">Student Portal: ${currentUser.fullName}</h2>
                    <p class="text-xs text-slate-500">Roll ID: ${currentUser.rollNumber} | Group: ${currentUser.group} | ${currentUser.semester}</p>
                </div>
                <div class="flex space-x-2">
                    <button onclick="renderStudentHome()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium shadow"><i class="fa-solid fa-house mr-1"></i> Home</button>
                    <button onclick="renderStudentMarks()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-award mr-1"></i> Marks</button>
                    <button onclick="renderStudentAttendance()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-calendar-check mr-1"></i> Attendance</button>
                </div>
            `;

            // Mock calculations or derived from attendance storage
            const subjects = ['Mathematics', 'Data Structures', 'Digital Logic', 'Database Systems'];
            let contentHtml = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-indigo-900 text-white p-5 rounded-xl shadow">
                        <h4 class="text-xs uppercase opacity-75 font-semibold">Overall Working Days</h4>
                        <p class="text-3xl font-bold mt-2">60</p>
                    </div>
                    <div class="bg-emerald-700 text-white p-5 rounded-xl shadow">
                        <h4 class="text-xs uppercase opacity-75 font-semibold">Total Present Days</h4>
                        <p class="text-3xl font-bold mt-2">51</p>
                    </div>
                    <div class="bg-blue-600 text-white p-5 rounded-xl shadow">
                        <h4 class="text-xs uppercase opacity-75 font-semibold">Overall Percentage</h4>
                        <p class="text-3xl font-bold mt-2">85.0%</p>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-3">Subject-wise Attendance Breakdown</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            subjects.forEach(sub => {
                contentHtml += `
                    <div onclick="openSubjectHistory('${sub}')" class="bg-white p-4 rounded-xl border shadow-sm hover:border-indigo-500 cursor-pointer transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-indigo-900">${sub}</span>
                            <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold">88% (Safe)</span>
                        </div>
                        <div class="text-xs text-slate-500 flex justify-between">
                            <span>Total Working Days: 15</span>
                            <span>Present Days: 13</span>
                        </div>
                    </div>
                `;
            });

            contentHtml += `</div>`;
            document.getElementById('dashboard-content').innerHTML = contentHtml;
        }

        function openSubjectHistory(subject) {
            const content = document.getElementById('dashboard-content');
            content.innerHTML = `
                <button onclick="renderStudentHome()" class="mb-4 text-xs bg-slate-200 px-3 py-1.5 rounded-lg font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</button>
                <div class="bg-white rounded-xl shadow border p-6">
                    <h3 class="text-lg font-bold text-indigo-900 mb-1">Detailed Log History: ${subject}</h3>
                    <p class="text-xs text-slate-500 mb-4">Complete day-by-day attendance audit for Roll No: ${currentUser.rollNumber}</p>
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b bg-slate-50 text-xs uppercase text-slate-600">
                                <th class="p-3">Date</th>
                                <th class="p-3">Session Time</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b"><td class="p-3">2026-08-10</td><td class="p-3">10:00 AM - 11:00 AM</td><td class="p-3"><span class="text-emerald-600 font-semibold">Present</span></td></tr>
                            <tr class="border-b"><td class="p-3">2026-08-12</td><td class="p-3">10:00 AM - 11:00 AM</td><td class="p-3"><span class="text-emerald-600 font-semibold">Present</span></td></tr>
                            <tr class="border-b"><td class="p-3">2026-08-14</td><td class="p-3">10:00 AM - 11:00 AM</td><td class="p-3"><span class="text-rose-600 font-semibold">Absent</span></td></tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function studentProfileView() {
            renderStudentHome(); // fallback toggle
        }

        function renderStudentMarks() {
            const header = document.getElementById('dashboard-header');
            // update active status on header buttons if needed
            document.getElementById('dashboard-content').innerHTML = `
                <div class="bg-white rounded-xl shadow border p-6">
                    <h3 class="text-lg font-bold text-indigo-900 mb-4"><i class="fa-solid fa-award mr-2"></i> Semester Marks Evaluation</h3>
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b bg-slate-50 text-xs uppercase text-slate-600">
                                <th class="p-3">Subject</th>
                                <th class="p-3">Exam Type</th>
                                <th class="p-3">Max Marks</th>
                                <th class="p-3">Marks Obtained</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b"><td class="p-3 font-medium">Mathematics</td><td class="p-3">Mid-Term</td><td class="p-3">30</td><td class="p-3 font-bold text-indigo-600">24</td></tr>
                            <tr class="border-b"><td class="p-3 font-medium">Data Structures</td><td class="p-3">Mid-Term</td><td class="p-3">30</td><td class="p-3 font-bold text-indigo-600">27</td></tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderStudentAttendance() {
            renderStudentHome();
        }


        /* ==================== LECTURER DASHBOARD ==================== */
        function renderLectureHome() {
            const header = document.getElementById('dashboard-header');
            header.innerHTML = `
                <div>
                    <h2 class="text-xl font-bold text-indigo-900">Lecturer Portal: ${currentUser.fullName}</h2>
                    <p class="text-xs text-slate-500">ID: ${currentUser.userId} | College: ${currentUser.college}</p>
                </div>
                <div class="flex space-x-2">
                    <button onclick="renderLectureHome()" class="px-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium"><i class="fa-solid fa-house mr-1"></i> Home</button>
                    <button onclick="renderLectureMarksManage()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-pen-to-square mr-1"></i> Marks</button>
                    <button onclick="renderLectureAttendanceManage()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-clipboard-user mr-1"></i> Attendance</button>
                    <button onclick="renderLectureStudentsManage()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium"><i class="fa-solid fa-users mr-1"></i> Students</button>
                </div>
            `;

            document.getElementById('dashboard-content').innerHTML = `
                <h3 class="text-lg font-bold text-slate-800 mb-4">Assigned Active Classes & Groups</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div onclick="openGroupDrilldown('CSE', 'Data Structures')" class="bg-white p-5 rounded-xl border shadow-sm hover:border-indigo-500 cursor-pointer transition">
                        <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-bold">Group: CSE</span>
                        <h4 class="font-bold text-slate-800 text-base mt-2">Data Structures</h4>
                        <p class="text-xs text-slate-500 mt-1">Active Attendance Management</p>
                    </div>
                    <div onclick="openGroupDrilldown('ECE', 'Digital Logic')" class="bg-white p-5 rounded-xl border shadow-sm hover:border-indigo-500 cursor-pointer transition">
                        <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-bold">Group: ECE</span>
                        <h4 class="font-bold text-slate-800 text-base mt-2">Digital Logic</h4>
                        <p class="text-xs text-slate-500 mt-1">Active Attendance Management</p>
