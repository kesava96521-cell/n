<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous College Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-indigo-400"></i>
                <span class="font-bold text-xl tracking-wide">Autonomous College Portal</span>
            </div>
            <div id="nav-auth-section" class="flex items-center space-x-4"></div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- 1. LOGIN -->
        <section id="view-login" class="max-w-md mx-auto bg-white rounded-xl shadow-lg border p-8 fade-in mt-10">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">Portal Login</h2>
            </div>
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">User ID / Roll / Mobile</label>
                    <input type="text" id="login-identifier" required class="w-full px-4 py-2 border rounded-lg outline-none text-sm focus:border-indigo-500">
                </div>
                <div class="relative">
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg outline-none text-sm pr-10 focus:border-indigo-500">
                    <button type="button" onclick="togglePass('login-password')" class="absolute right-3 top-9 text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-eye"></i></button>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Login</button>
            </form>
            <p class="mt-6 text-center text-sm">New User? <button onclick="switchView('view-register-select')" class="text-indigo-600 font-semibold underline">Create Now</button></p>
        </section>

        <!-- 2. REGISTRATION SELECTION -->
        <section id="view-register-select" class="max-w-md mx-auto bg-white rounded-xl shadow-lg border p-8 fade-in mt-10 hidden">
            <h2 class="text-xl font-bold text-indigo-900 mb-6 text-center">Select Occupation</h2>
            <select id="reg-occupation" class="w-full p-3 border rounded-lg mb-6 outline-none">
                <option value="student">Student</option>
                <option value="lecture">Lecturer</option>
                <option value="hod">HOD</option>
            </select>
            <div class="flex gap-3">
                <button onclick="switchView('view-login')" class="w-1/2 bg-slate-200 py-2 rounded-lg">Back</button>
                <button onclick="prepareRegistration()" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg">Next</button>
            </div>
        </section>

        <!-- 3. DYNAMIC REGISTRATION FORM -->
        <section id="view-register-form" class="max-w-lg mx-auto bg-white rounded-xl shadow-lg border p-8 fade-in mt-6 hidden">
            <h2 id="reg-form-title" class="text-xl font-bold text-indigo-900 mb-6 text-center">Registration</h2>
            <form id="dynamic-reg-form" onsubmit="handleRegistrationSubmit(event)" class="space-y-4">
                <!-- Fields injected via JS -->
            </form>
        </section>

        <!-- 4. DASHBOARD -->
        <section id="view-dashboard" class="fade-in hidden">
            <div id="dashboard-header" class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border mb-6"></div>
            <div id="dashboard-content"></div>
        </section>
    </main>

    <script>
        // Password Toggle Function
        function togglePass(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function switchView(viewId) {
            ['view-login', 'view-register-select', 'view-register-form', 'view-dashboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-identifier').value;
            const pass = document.getElementById('login-password').value;
            const users = JSON.parse(localStorage.getItem('users') || "[]");
            const user = users.find(u => (u.rollNumber === id || u.userId === id || u.mobile === id) && u.password === pass);

            if (user) {
                Swal.fire({ icon: 'success', title: 'Login Successful', text: 'Welcome back!' });
                sessionStorage.setItem('activeUser', JSON.stringify(user));
                window.location.reload(); // Simple refresh to load dashboard
            } else {
                Swal.fire({ icon: 'error', title: 'Invalid Credentials', text: 'Please check your ID or Password.' });
            }
        }

        function prepareRegistration() {
            const role = document.getElementById('reg-occupation').value;
            const form = document.getElementById('dynamic-reg-form');
            document.getElementById('reg-form-title').innerText = `Register as ${role.toUpperCase()}`;
            
            let fields = `<input type="hidden" id="reg-role" value="${role}">`;
            if (role === 'student') fields += `<input type="text" id="r-clg" placeholder="College Name" required class="w-full p-2 border rounded"><input type="text" id="r-name" placeholder="Full Name" required class="w-full p-2 border rounded"><input type="text" id="r-roll" placeholder="Roll Number" required class="w-full p-2 border rounded">`;
            else fields += `<input type="text" id="r-name" placeholder="Full Name" required class="w-full p-2 border rounded"><input type="text" id="r-mobile" placeholder="Mobile Number" required class="w-full p-2 border rounded">`;
            
            fields += `
                <div class="relative"><input type="password" id="r-pass" placeholder="Password" required class="w-full p-2 border rounded pr-10"><button type="button" onclick="togglePass('r-pass')" class="absolute right-3 top-2 text-slate-400"><i class="fa-solid fa-eye"></i></button></div>
                <div class="relative"><input type="password" id="r-cpass" placeholder="Confirm Password" required class="w-full p-2 border rounded pr-10"><button type="button" onclick="togglePass('r-cpass')" class="absolute right-3 top-2 text-slate-400"><i class="fa-solid fa-eye"></i></button></div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg">Register</button>
            `;
            form.innerHTML = fields;
            switchView('view-register-form');
        }

        function handleRegistrationSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('r-pass').value;
            const cpass = document.getElementById('r-cpass').value;
            if (pass !== cpass) {
                Swal.fire({ icon: 'warning', title: 'Oops', text: 'Passwords do not match!' });
                return;
            }
            // Add user logic...
            Swal.fire({ icon: 'success', title: 'Registered!', text: 'Account created successfully.' });
            switchView('view-login');
        }

        // Logic check on load
        if (sessionStorage.getItem('activeUser')) {
            switchView('view-dashboard');
            // Populate dashboard logic here...
        }
    </script>
</body>
</html>
